[package]
name = "linux-patch-api"
version = "2.5.0"
edition = "2021"
authors = ["Draco-Lunaris-Echo"]
license = "MIT"
description = "Secure remote package management API for Linux systems"
repository = "https://github.com/Draco-Lunaris/Linux-Patch-Api"
homepage = "https://github.com/Draco-Lunaris/Linux-Patch-Api"
keywords = ["apt", "dnf", "pacman", "apk", "patch-management"]
categories = ["network-programming", "api-bindings"]

[lib]
name = "linux_patch_api"
path = "src/lib.rs"

[features]
default = []
test-utils = []

[dependencies]
actix = "0.13"
actix-governor = "0.6"
actix-web = { version = "4", features = ["rustls-0_23"] }
actix-web-httpauth = "0.8"
actix-web-actors = "4"
anyhow = "1"
arc-swap = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
config = { version = "0.14", default-features = false, features = ["yaml"] }
dashmap = "6"
fs2 = "0.4"
futures-util = "0.3"
hex = "0.4"
if-addrs = "0.7"
notify = "7"
once_cell = "1"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rustls = "0.23"
rustls-pemfile = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
signal-hook = "0.3"
socket2 = "0.5"
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
x509-parser = { version = "0.16", features = ["verify"] }
sha2 = "0.10"
url = "2"

[dev-dependencies]
actix-rt = "2"
criterion = "0.5"
linux-patch-api = { path = ".", features = ["test-utils"] }
tokio-test = "0.4"
mockall = "0.13"
serial_test = "3"
tempfile = "3"
rcgen = "0.13"
wiremock = "0.6"

[[test]]
name = "enroll_identity"
path = "tests/unit/enroll_identity.rs"

[[test]]
name = "enrollment_test"
path = "tests/integration/enrollment_test.rs"

[[test]]
name = "enrollment_e2e"
path = "tests/e2e/test_enrollment_e2e.rs"

[[test]]
name = "auth_test"
path = "tests/integration/auth_test.rs"

[[test]]
name = "rate_limit_test"
path = "tests/unit/rate_limit_test.rs"

[[test]]
name = "apt_serialization_test"
path = "tests/unit/apt_serialization_test.rs"

[[test]]
name = "backend_error_test"
path = "tests/unit/backend_error_test.rs"

[[test]]
name = "scheduler_test"
path = "tests/unit/scheduler_test.rs"

[[test]]
name = "scheduler_production_path_test"
path = "tests/unit/scheduler_production_path_test.rs"

[[test]]
name = "service_file_test"
path = "tests/unit/service_file_test.rs"

[[bench]]
name = "api_benchmarks"
harness = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
opt-level = 3

[profile.dev]
opt-level = 0
debug = true

[[bin]]
name = "linux-patch-api"
path = "src/main.rs"
