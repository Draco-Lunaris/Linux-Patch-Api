name: CI

# Releases-only: CI fires on version tags (+ manual dispatch).
# Local dev/test uses `just check` on the dev box; this workflow is the
# release-time gate + the official per-distro package builder.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Quality Gates (release-time; local dev uses `just check`) ─────────────

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just fmt

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just deps-deb
      - run: just clippy

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just deps-deb
      - run: just test

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,just
      - run: just audit

  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  enrollment-tests:
    name: Enrollment Tests
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just deps-deb
      - run: just enrollment-test

  # ── Release Preparation (tag push only) ───────────────────────────────────

  prepare-release:
    name: Prepare Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate release notes
        id: release_notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.release_notes.outputs.notes }}

  # ── Build Jobs (tag push only, self-hosted runners) ───────────────────────

  build-deb-u2404:
    name: Build .deb (Ubuntu 24.04)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release]
    runs-on: [self-hosted, linux, ubuntu-24.04]
    steps:
      - name: Clean previous build artifacts from root
        run: sudo rm -rf releases/ || true
      - uses: actions/checkout@v7
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just deps-deb
      - run: just pkg-deb
      - name: Rename package with distro suffix
        run: |
          FILE=$(ls linux-patch-api_*_amd64.deb 2>/dev/null | head -1)
          if [ -n "$FILE" ]; then
            mv "$FILE" "$(echo "$FILE" | sed 's/_amd64/_u2404_amd64/; s/-[0-9]\+_/_/g')"
          fi
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: linux-patch-api_*_u2404_amd64.deb

  build-deb-u2604:
    name: Build .deb (Ubuntu 26.04)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release]
    runs-on: [self-hosted, linux, ubuntu-26.04]
    steps:
      - name: Clean previous build artifacts from root
        run: sudo rm -rf releases/ || true
      - uses: actions/checkout@v7
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just deps-deb
      - run: just pkg-deb
      - name: Rename package with distro suffix
        run: |
          FILE=$(ls linux-patch-api_*_amd64.deb 2>/dev/null | head -1)
          if [ -n "$FILE" ]; then
            mv "$FILE" "$(echo "$FILE" | sed 's/_amd64/_u2604_amd64/; s/-[0-9]\+_/_/g')"
          fi
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: linux-patch-api_*_u2604_amd64.deb

  build-deb-u2204:
    name: Build .deb (Ubuntu 22.04)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release]
    runs-on: [self-hosted, linux, ubuntu-22.04]
    steps:
      - name: Clean previous build artifacts from root
        run: sudo rm -rf releases/ || true
      - uses: actions/checkout@v7
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just deps-deb
      - run: just pkg-deb
      - name: Rename package with distro suffix
        run: |
          FILE=$(ls linux-patch-api_*_amd64.deb 2>/dev/null | head -1)
          if [ -n "$FILE" ]; then
            mv "$FILE" "$(echo "$FILE" | sed 's/_amd64/_u2204_amd64/; s/-[0-9]\+_/_/g')"
          fi
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: linux-patch-api_*_u2204_amd64.deb

  build-deb-debian12:
    name: Build .deb (Debian 12)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release]
    runs-on: [self-hosted, linux, debian-12]
    steps:
      - name: Clean previous build artifacts from root
        run: sudo rm -rf releases/ || true
      - uses: actions/checkout@v7
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just deps-deb
      - run: just pkg-deb
      - name: Rename package with distro suffix
        run: |
          FILE=$(ls linux-patch-api_*_amd64.deb 2>/dev/null | head -1)
          if [ -n "$FILE" ]; then
            mv "$FILE" "$(echo "$FILE" | sed 's/_amd64/_debian12_amd64/; s/-[0-9]\+_/_/g')"
          fi
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: linux-patch-api_*_debian12_amd64.deb

  build-deb-debian13:
    name: Build .deb (Debian 13)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release]
    runs-on: [self-hosted, linux, debian-13]
    steps:
      - name: Clean previous build artifacts from root
        run: sudo rm -rf releases/ || true
      - uses: actions/checkout@v7
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just deps-deb
      - run: just pkg-deb
      - name: Rename package with distro suffix
        run: |
          FILE=$(ls linux-patch-api_*_amd64.deb 2>/dev/null | head -1)
          if [ -n "$FILE" ]; then
            mv "$FILE" "$(echo "$FILE" | sed 's/_amd64/_debian13_amd64/; s/-[0-9]\+_/_/g')"
          fi
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: linux-patch-api_*_debian13_amd64.deb

  build-rpm-fedora:
    name: Build .rpm (Fedora)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release]
    runs-on: [self-hosted, linux, fedora]
    steps:
      - name: Clean previous build artifacts from root
        run: sudo rm -rf releases/ || true
      - uses: actions/checkout@v7
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just deps-rpm
      - run: just pkg-rpm
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: releases/linux-patch-api-*.rpm

  build-rpm-almalinux:
    name: Build .rpm (AlmaLinux 10)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release]
    runs-on: [self-hosted, linux, almalinux-10]
    steps:
      - name: Clean previous build artifacts from root
        run: sudo rm -rf releases/ || true
      - uses: actions/checkout@v7
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just deps-rpm
      - run: just pkg-rpm
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: releases/linux-patch-api-*.rpm

  build-arch:
    name: Build .pkg.tar.zst (Arch Linux)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release]
    runs-on: [self-hosted, linux, arch]
    steps:
      - name: Clean previous build artifacts from root
        run: sudo rm -rf releases/ || true
      - uses: actions/checkout@v7
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - run: just deps-arch
      - run: just pkg-arch
      - name: Rename packages to strip release number
        run: |
          cd releases
          for f in *.pkg.tar.zst; do
            [ -f "$f" ] && mv "$f" "$(echo "$f" | sed 's/-[0-9]\+-/-/')"
          done
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: releases/*.pkg.tar.zst
      - name: Restart agent service
        if: always()
        run: |
          sudo systemctl start linux-patch-api.service 2>/dev/null || true
          sudo rc-service linux-patch-api start 2>/dev/null || true

  build-alpine:
    name: Build .apk (Alpine)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release]
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
      env:
        HOME: /root
    steps:
      - name: Install prerequisites for actions/checkout + just
        run: apk add --no-cache bash git curl tar
      - uses: actions/checkout@v7
      - name: Install Alpine build dependencies
        run: apk add --no-cache gcc musl-dev openssl-dev openssl elogind-dev alpine-sdk abuild
      - name: Install just
        run: curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | sh -s -- --to /usr/local/bin
      - name: Install Rust via rustup
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: Swatinem/rust-cache@v2
        with:
          key: alpine-musl
      - run: just deps-alpine
      - run: just pkg-alpine
      - name: Rename APK to strip release number
        run: |
          cd releases
          for f in linux-patch-api-*.apk; do
            [ -f "$f" ] && mv "$f" "$(echo "$f" | sed 's/-r[0-9]\+\.apk/.apk/')"
          done
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: releases/linux-patch-api-*.apk