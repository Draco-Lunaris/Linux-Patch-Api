name: CI

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 3 * * *'

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  # ── Quality Gates (GitHub-hosted, all triggers) ──────────────────────────

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsystemd-dev pkg-config libssl-dev
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsystemd-dev pkg-config libssl-dev
      - run: cargo test --all-features

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --ignore RUSTSEC-2025-0134 --ignore RUSTSEC-2026-0190 --ignore RUSTSEC-2026-0204 --ignore RUSTSEC-2026-0205

  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  enrollment-tests:
    name: Enrollment Tests
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsystemd-dev pkg-config libssl-dev
      - run: cargo test --test enroll_identity
      - run: cargo test --test enrollment_test
      - run: cargo test --test enrollment_e2e

  fuzz:
    name: Fuzz Tests
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsystemd-dev pkg-config libssl-dev
      - name: Run fuzz tests (5000 random iterations)
        run: LPA_FUZZ_RANDOM_ITER=5000 cargo test --test concurrency_invariant_test -- fuzz_
        env:
          RUST_BACKTRACE: 1

  fuzz-nightly:
    name: Nightly Exhaustive Fuzz
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsystemd-dev pkg-config libssl-dev
      - name: Run exhaustive fuzz (50000 random + 10000 truncated)
        run: |
          LPA_FUZZ_RANDOM_ITER=50000 LPA_FUZZ_TRUNCATED_ITER=10000 cargo test --test concurrency_invariant_test -- fuzz_
        env:
          RUST_BACKTRACE: 1

  # ── Packaged Service Integration Tests (PR + tag, self-hosted) ──────────
  #
  # These jobs build the .deb on real Ubuntu runners, install it,
  # generate temporary TLS material, start linux-patch-api.service,
  # require it to reach active, then submit package operations
  # through the real mTLS API endpoint. The package transaction runs
  # as a descendant of linux-patch-api.service — NOT from the runner
  # shell.
  #
  # Two test phases:
  #   1. Basic service-path: harmless package reinstall via API
  #   2. Kernel regression: reinstall a known installed kernel package
  #      via API and verify initramfs integrity (vmlinuz, initrd,
  #      lsinitramfs, module entries for the exact kernel ABI)
  #
  # LXC runners that lack /lib/modules use an explicitly named
  # REDUCED_COVERAGE mode that is NOT reported as full kernel coverage.
  #
  # Artifacts uploaded: effective unit, service status, API request and
  # job output, process/cgroup evidence, apt history and terminal logs,
  # dpkg log and audit output, exact tested kernel ABI, lsinitramfs
  # output.

  integration-u2404:
    name: Integration (Ubuntu 24.04)
    needs: [fmt, clippy, test]
    runs-on: [self-hosted, linux, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential libsystemd-dev pkg-config libssl-dev
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl openssl python3 initramfs-tools 2>/dev/null || true
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Run integration test
        run: |
          chmod +x scripts/integration-test.sh
          scripts/integration-test.sh --no-reboot
      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-u2404-artifacts
          path: /tmp/lpa-integration-artifacts/
          retention-days: 30

  integration-u2604:
    name: Integration (Ubuntu 26.04)
    needs: [fmt, clippy, test]
    runs-on: [self-hosted, linux, ubuntu-26.04]
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential libsystemd-dev pkg-config libssl-dev
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl openssl python3 initramfs-tools 2>/dev/null || true
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Run integration test
        run: |
          chmod +x scripts/integration-test.sh
          scripts/integration-test.sh --no-reboot
      - name: Upload integration artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-u2604-artifacts
          path: /tmp/lpa-integration-artifacts/
          retention-days: 30

  # ── Release Preparation (tag push only) ───────────────────────────────────

  prepare-release:
    name: Prepare Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, fuzz, audit, integration-u2404, integration-u2604]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate release notes
        id: release_notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.release_notes.outputs.notes }}

  # ── Build Jobs (tag push only, self-hosted runners) ───────────────────────

  build-deb-u2404:
    name: Build .deb (Ubuntu 24.04)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release, integration-u2404, integration-u2604]
    runs-on: [self-hosted, linux, ubuntu-24.04]
    steps:
      - name: Clean previous build artifacts from root
        run: sudo rm -rf releases/ || true
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential libsystemd-dev pkg-config libssl-dev
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build .deb package
        run: chmod +x scripts/build-package.sh && scripts/build-package.sh
      - name: Rename package with distro suffix
        run: |
          FILE=$(ls linux-patch-api_*_amd64.deb 2>/dev/null | head -1)
          if [ -n "$FILE" ]; then
            mv "$FILE" "$(echo "$FILE" | sed 's/_amd64/_u2404_amd64/; s/-[0-9]\+_/_/g')"
          fi
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: linux-patch-api_*_u2404_amd64.deb

  build-deb-u2604:
    name: Build .deb (Ubuntu 26.04)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release, integration-u2404, integration-u2604]
    runs-on: [self-hosted, linux, ubuntu-26.04]
    steps:
      - name: Clean previous build artifacts from root
        run: sudo rm -rf releases/ || true
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential libsystemd-dev pkg-config libssl-dev
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build .deb package
        run: chmod +x scripts/build-package.sh && scripts/build-package.sh
      - name: Rename package with distro suffix
        run: |
          FILE=$(ls linux-patch-api_*_amd64.deb 2>/dev/null | head -1)
          if [ -n "$FILE" ]; then
            mv "$FILE" "$(echo "$FILE" | sed 's/_amd64/_u2604_amd64/; s/-[0-9]\+_/_/g')"
          fi
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: linux-patch-api_*_u2604_amd64.deb

  build-deb-u2204:
    name: Build .deb (Ubuntu 22.04)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release, integration-u2404, integration-u2604]
    runs-on: [self-hosted, linux, ubuntu-22.04]
    steps:
      - name: Clean previous build artifacts from root
        run: sudo rm -rf releases/ || true
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential libsystemd-dev pkg-config libssl-dev
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build .deb package
        run: chmod +x scripts/build-package.sh && scripts/build-package.sh
      - name: Rename package with distro suffix
        run: |
          FILE=$(ls linux-patch-api_*_amd64.deb 2>/dev/null | head -1)
          if [ -n "$FILE" ]; then
            mv "$FILE" "$(echo "$FILE" | sed 's/_amd64/_u2204_amd64/; s/-[0-9]\+_/_/g')"
          fi
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: linux-patch-api_*_u2204_amd64.deb

  build-deb-debian12:
    name: Build .deb (Debian 12)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release, integration-u2404, integration-u2604]
    runs-on: [self-hosted, linux, debian-12]
    steps:
      - name: Clean previous build artifacts from root
        run: sudo rm -rf releases/ || true
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential libsystemd-dev pkg-config libssl-dev
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build .deb package
        run: chmod +x scripts/build-package.sh && scripts/build-package.sh
      - name: Rename package with distro suffix
        run: |
          FILE=$(ls linux-patch-api_*_amd64.deb 2>/dev/null | head -1)
          if [ -n "$FILE" ]; then
            mv "$FILE" "$(echo "$FILE" | sed 's/_amd64/_debian12_amd64/; s/-[0-9]\+_/_/g')"
          fi
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: linux-patch-api_*_debian12_amd64.deb

  build-deb-debian13:
    name: Build .deb (Debian 13)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release, integration-u2404, integration-u2604]
    runs-on: [self-hosted, linux, debian-13]
    steps:
      - name: Clean previous build artifacts from root
        run: sudo rm -rf releases/ || true
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential libsystemd-dev pkg-config libssl-dev
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build .deb package
        run: chmod +x scripts/build-package.sh && scripts/build-package.sh
      - name: Rename package with distro suffix
        run: |
          FILE=$(ls linux-patch-api_*_amd64.deb 2>/dev/null | head -1)
          if [ -n "$FILE" ]; then
            mv "$FILE" "$(echo "$FILE" | sed 's/_amd64/_debian13_amd64/; s/-[0-9]\+_/_/g')"
          fi
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: linux-patch-api_*_debian13_amd64.deb

  build-rpm-fedora:
    name: Build .rpm (Fedora)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release, integration-u2404, integration-u2604]
    runs-on: [self-hosted, linux, fedora]
    steps:
      - name: Clean previous build artifacts from root
        run: sudo rm -rf releases/ || true
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo dnf install -y systemd-devel openssl-devel pkg-config gcc make
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build release binary
        run: cargo build --release
      - name: Build RPM package
        run: chmod +x build-rpm.sh && SKIP_CARGO_BUILD=1 sudo -E ./build-rpm.sh
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: releases/linux-patch-api-*.rpm

  build-rpm-almalinux:
    name: Build .rpm (AlmaLinux 10)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release, integration-u2404, integration-u2604]
    runs-on: [self-hosted, linux, almalinux-10]
    steps:
      - name: Clean previous build artifacts from root
        run: sudo rm -rf releases/ || true
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo dnf install -y systemd-devel openssl-devel pkg-config gcc make
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build release binary
        run: cargo build --release
      - name: Build RPM package
        run: chmod +x build-rpm.sh && SKIP_CARGO_BUILD=1 sudo -E ./build-rpm.sh
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: releases/linux-patch-api-*.rpm

  build-arch:
    name: Build .pkg.tar.zst (Arch Linux)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release, integration-u2404, integration-u2604]
    runs-on: [self-hosted, linux, arch]
    steps:
      - name: Clean previous build artifacts from root
        run: sudo rm -rf releases/ || true
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo pacman -Syu --noconfirm systemd openssl pkg-config gcc
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build release binary
        run: cargo build --release
      - name: Build Arch package
        run: chmod +x build-arch.sh && SKIP_CARGO_BUILD=1 ./build-arch.sh
      - name: Rename packages to strip release number
        run: |
          cd releases
          for f in *.pkg.tar.zst; do
            [ -f "$f" ] && mv "$f" "$(echo "$f" | sed 's/-[0-9]\+-/-/')"
          done
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: releases/*.pkg.tar.zst

  build-alpine:
    name: Build .apk (Alpine)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release, integration-u2404, integration-u2604]
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
      env:
        HOME: /root
    steps:
      - name: Install prerequisites for actions/checkout
        run: apk add --no-cache bash git curl tar
      - uses: actions/checkout@v7
      - name: Install Alpine build dependencies
        run: apk add --no-cache gcc musl-dev openssl-dev openssl elogind-dev alpine-sdk abuild
      - name: Install Rust via rustup
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl
      - name: Build release binary (musl target)
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Build Alpine package
        run: |
          chmod +x build-alpine.sh
          SKIP_CARGO_BUILD=1 ./build-alpine.sh
      - name: Rename APK to strip release number
        run: |
          cd releases
          for f in linux-patch-api-*.apk; do
            [ -f "$f" ] && mv "$f" "$(echo "$f" | sed 's/-r[0-9]\+\.apk/.apk/')"
          done
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: releases/linux-patch-api-*.apk
