  # Debian/Ubuntu Package Build
  build-deb:
    name: Build Debian Package
    runs-on: linux
    container: debian:bookworm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential debhelper cargo rustc libsystemd-dev pkg-config
      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b
      - name: Copy .deb to workspace
        run: cp ../linux-patch-api_*.deb .
      - name: Upload to releases (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: linux-patch-api_*.deb

  # RHEL/CentOS/Fedora Package Build
  build-rpm:
    name: Build RPM Package
    runs-on: linux
    container: fedora:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install RPM build tools
        run: |
          dnf install -y rpm-build gcc cargo rust libsystemd-devel pkgconfig-pkg-config
      - name: Build release binary
        run: cargo build --release
      - name: Build RPM package
        run: ./build-rpm.sh
      - name: Upload to releases (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: ~/rpmbuild/RPMS/x86_64/*.rpm

  # Alpine Package Build
  build-apk:
    name: Build Alpine Package
    runs-on: linux
    container: alpine:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          apk add --no-cache rust cargo musl-dev openssl-dev systemd-dev git abuild
      - name: Build APK package
        run: ./build-alpine.sh
      - name: Upload to releases (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: releases/*.apk

  # Arch Linux Package Build
  build-arch:
    name: Build Arch Package
    runs-on: linux
    container: archlinux:latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm rust cargo systemd git base-devel
      - name: Build release binary
        run: cargo build --release
      - name: Build Arch package
        run: ./build-arch.sh
      - name: Upload to releases (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          files: releases/*.pkg.tar.zst

