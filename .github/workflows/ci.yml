name: CI

on:
  push:
    branches: [master]
    tags: ['v*.*.*']
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: write

jobs:
  # ── Quality Gates (GitHub-hosted, all triggers) ──────────────────────────

  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsystemd-dev pkg-config libssl-dev
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsystemd-dev pkg-config libssl-dev
      - run: cargo test --all-features

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: cargo audit --ignore RUSTSEC-2025-0134

  gitleaks:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  enrollment-tests:
    name: Enrollment Tests
    needs: [fmt, clippy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y build-essential libsystemd-dev pkg-config libssl-dev
      - run: cargo test --test enroll_identity
      - run: cargo test --test enrollment_test
      - run: cargo test --test enrollment_e2e

  # ── Release Preparation (tag push only) ───────────────────────────────────

  prepare-release:
    name: Prepare Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate release notes
        id: release_notes
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            NOTES=$(git log ${PREV_TAG}..HEAD --pretty=format:"- %s (%h)" --no-merges)
          else
            NOTES=$(git log --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.release_notes.outputs.notes }}

  # ── Build Jobs (tag push only, self-hosted runners) ───────────────────────

  build-deb-u2404:
    name: Build .deb (Ubuntu 24.04)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release]
    runs-on: [self-hosted, linux, ubuntu-24.04]
    steps:
      - name: Clean previous build artifacts from root
        run: sudo rm -rf releases/ || true
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential libsystemd-dev pkg-config libssl-dev
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build .deb package
        run: chmod +x scripts/build-package.sh && scripts/build-package.sh
      - name: Rename package with distro suffix
        run: |
          FILE=$(ls linux-patch-api_*_amd64.deb 2>/dev/null | head -1)
          if [ -n "$FILE" ]; then
            mv "$FILE" "$(echo "$FILE" | sed 's/_amd64/_u2404_amd64/')"
          fi
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: linux-patch-api_*_u2404_amd64.deb

  build-deb-u2204:
    name: Build .deb (Ubuntu 22.04)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release]
    runs-on: [self-hosted, linux, ubuntu-22.04]
    steps:
      - name: Clean previous build artifacts from root
        run: sudo rm -rf releases/ || true
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential libsystemd-dev pkg-config libssl-dev
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build .deb package
        run: chmod +x scripts/build-package.sh && scripts/build-package.sh
      - name: Rename package with distro suffix
        run: |
          FILE=$(ls linux-patch-api_*_amd64.deb 2>/dev/null | head -1)
          if [ -n "$FILE" ]; then
            mv "$FILE" "$(echo "$FILE" | sed 's/_amd64/_u2204_amd64/')"
          fi
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: linux-patch-api_*_u2204_amd64.deb

  build-deb-debian13:
    name: Build .deb (Debian 13)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release]
    runs-on: [self-hosted, linux, debian-13]
    steps:
      - name: Clean previous build artifacts from root
        run: sudo rm -rf releases/ || true
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y build-essential libsystemd-dev pkg-config libssl-dev
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build .deb package
        run: chmod +x scripts/build-package.sh && scripts/build-package.sh
      - name: Rename package with distro suffix
        run: |
          FILE=$(ls linux-patch-api_*_amd64.deb 2>/dev/null | head -1)
          if [ -n "$FILE" ]; then
            mv "$FILE" "$(echo "$FILE" | sed 's/_amd64/_debian13_amd64/')"
          fi
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: linux-patch-api_*_debian13_amd64.deb

  build-rpm-fedora:
    name: Build .rpm (Fedora)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release]
    runs-on: [self-hosted, linux, fedora]
    steps:
      - name: Clean previous build artifacts from root
        run: sudo rm -rf releases/ || true
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo dnf install -y systemd-devel openssl-devel pkg-config gcc make
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build release binary
        run: cargo build --release
      - name: Build RPM package
        run: chmod +x build-rpm.sh && SKIP_CARGO_BUILD=1 sudo -E ./build-rpm.sh
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: releases/linux-patch-api-*.rpm

  build-rpm-almalinux:
    name: Build .rpm (AlmaLinux 10)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release]
    runs-on: [self-hosted, linux, almalinux-10]
    steps:
      - name: Clean previous build artifacts from root
        run: sudo rm -rf releases/ || true
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo dnf install -y systemd-devel openssl-devel pkg-config gcc make
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build release binary
        run: cargo build --release
      - name: Build RPM package
        run: chmod +x build-rpm.sh && SKIP_CARGO_BUILD=1 sudo -E ./build-rpm.sh
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: releases/linux-patch-api-*.rpm

  build-arch:
    name: Build .pkg.tar.zst (Arch Linux)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release]
    runs-on: [self-hosted, linux, arch]
    steps:
      - name: Clean previous build artifacts from root
        run: sudo rm -rf releases/ || true
      - uses: actions/checkout@v7
      - name: Install system dependencies
        run: sudo pacman -Syu --noconfirm systemd openssl pkg-config gcc
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build release binary
        run: cargo build --release
      - name: Build Arch package
        run: chmod +x build-arch.sh && SKIP_CARGO_BUILD=1 ./build-arch.sh
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: releases/*.pkg.tar.zst

  build-alpine:
    name: Build .apk (Alpine)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [fmt, clippy, test, enrollment-tests, audit, prepare-release]
    runs-on: ubuntu-latest
    container:
      image: alpine:latest
      env:
        HOME: /root
    steps:
      - name: Install prerequisites for actions/checkout
        run: apk add --no-cache bash git curl tar
      - uses: actions/checkout@v7
      - name: Install Alpine build dependencies
        run: apk add --no-cache gcc musl-dev openssl-dev openssl elogind-dev alpine-sdk abuild
      - name: Install Rust via rustup
        run: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Add musl target
        run: rustup target add x86_64-unknown-linux-musl
      - name: Build release binary (musl target)
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Build Alpine package
        run: |
          chmod +x build-alpine.sh
          SKIP_CARGO_BUILD=1 ./build-alpine.sh
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: releases/linux-patch-api-*.apk

  # ── Publish to Manager-Hosted Repo (tag push only) ──────────────────────

  publish-to-manager-repo:
    name: Publish to Manager Repo
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-deb-u2404, build-deb-u2204, build-deb-debian13, build-rpm-fedora, build-rpm-almalinux, build-arch, build-alpine]
    runs-on: [self-hosted, linux]
    steps:
      - name: Install signing tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-sig rpm-sign createrepo-c gpg jq openssh-client
      - name: Download all release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          mkdir -p artifacts
          curl -sfL -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/$TAG_NAME" | \
            jq -r '.assets[].browser_download_url' | \
            while read -r url; do
              filename=$(basename "$url")
              curl -sfL -H "Authorization: token $GITHUB_TOKEN" -o "artifacts/$filename" "$url"
            done
      - name: Import GPG signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.LPA_REPO_GPG_KEY }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --list-secret-keys
      - name: Sign and publish .deb packages
        run: |
          for deb in artifacts/*.deb; do
            dpkg-sig --sign builder -k LPA-REPO-SIGNING-KEY "$deb"
            codename=$(echo "$deb" | grep -oP '(?:u2404|u2204|debian13)' | \
              sed 's/u2404/noble/;s/u2204/jammy/;s/debian13/trixie/')
            ssh root@manager.moon-dragon.us \
              "reprepro -b /var/www/lpa-repo/apt includedeb $codename -" < "$deb"
          done
      - name: Sign and publish .rpm packages
        run: |
          for rpm in artifacts/*.rpm; do
            rpmsign --addsign --key-id LPA-REPO-SIGNING-KEY "$rpm"
            scp "$rpm" root@manager.moon-dragon.us:/var/www/lpa-repo/dnf/el9/Packages/
          done
          ssh root@manager.moon-dragon.us "createrepo_c --update /var/www/lpa-repo/dnf/el9/ && \
            gpg --batch --detach-sign --armor /var/www/lpa-repo/dnf/el9/repodata/repomd.xml"
      - name: Sign and publish .apk packages
        run: |
          for apk in artifacts/*.apk; do
            scp "$apk" root@manager.moon-dragon.us:/var/www/lpa-repo/apk/v3.21/
          done
          ssh root@manager.moon-dragon.us \
            "cd /var/www/lpa-repo/apk/v3.21/ && \
             for apk in *.apk; do abuild-sign -k ~/.abuild/lpa-privkey.rsa \"\$apk\"; done && \
             apk index *.apk -o APKINDEX.tar.gz && \
             abuild-sign APKINDEX.tar.gz"
      - name: Sign and publish Arch packages
        run: |
          for zst in artifacts/*.pkg.tar.zst; do
            gpg --detach-sign --armor "$zst"
            scp "$zst" "$zst.asc" root@manager.moon-dragon.us:/var/www/lpa-repo/pacman/x86_64/
          done
          ssh root@manager.moon-dragon.us \
            "repo-add /var/www/lpa-repo/pacman/x86_64/lpa-repo.db.tar.zst /var/www/lpa-repo/pacman/x86_64/*.pkg.tar.zst && \
             gpg --detach-sign --armor /var/www/lpa-repo/pacman/x86_64/lpa-repo.db"
